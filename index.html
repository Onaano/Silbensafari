<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Silben-Safari — Wörter hören, zerlegen &amp; zusammensetzen | Förderfreude Games</title>
<style>
  :root{
    --cream:#fbf3e1; --sand:#f7e6b8; --ink:#3a3226; --muted:#665c50;
    --panel:#fffcf5; --edge:rgba(58,50,38,.2);
    --gelb:#eec14a; --gelb-d:#8f6c0c; --terra:#d97e55; --terra-d:#9a4a28;
    --salbei:#8fa888; --salbei-d:#4d6649; --rosa:#d98a92; --rosa-d:#8c4852; --blau:#8fb9c9; --blau-d:#3f6f80;
    --font:'Andika','Century Gothic','Trebuchet MS','Verdana',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior:none; }
  body{ font-family:var(--font); color:var(--ink); background:linear-gradient(180deg,#f9e3a8 0%,#fbefcc 42%,var(--cream) 100%); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; padding:0; color:inherit; }
  button:focus-visible{ outline:4px solid var(--blau-d); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } }

  .sun{ position:fixed; top:3.5vh; right:6vw; width:min(11vw,76px); height:min(11vw,76px); border-radius:50%; background:radial-gradient(circle at 35% 32%,#fff6d8,var(--gelb) 58%,#d9a62a 100%); box-shadow:0 0 34px 12px rgba(238,193,74,.4); z-index:0; pointer-events:none; }
  .scene{ position:fixed; left:0; right:0; bottom:0; height:min(24vh,190px); z-index:0; pointer-events:none; overflow:hidden; }
  .scene svg{ width:100%; height:100%; display:block; }

  header{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:1.2vh 3vw .4vh; gap:2vw; position:relative; z-index:5; }
  .brand{ font-weight:800; font-size:clamp(14px,2vw,19px); letter-spacing:.04em; display:flex; align-items:center; gap:1.2vw; }
  .brand svg{ width:clamp(22px,3vw,30px); height:clamp(22px,3vw,30px); }
  .icon-btn{ width:clamp(44px,5vw,52px); height:clamp(44px,5vw,52px); border-radius:50%; background:var(--panel); border:2px solid var(--edge); display:flex; align-items:center; justify-content:center; font-size:clamp(16px,2vw,20px); }
  .icon-btn[aria-pressed="false"]{ opacity:.55; } .icon-btn:active{ transform:scale(.92); }
  .pill-btn{ display:flex; align-items:center; gap:1vw; font-weight:700; font-size:clamp(12.5px,1.6vw,15px); background:var(--panel); border:2px solid var(--edge); border-radius:999px; padding:.8vh 2.6vw; min-height:44px; white-space:nowrap; }
  .pill-btn:active{ transform:scale(.95); }

  .screen{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
  .screen[hidden]{ display:none; } .screen-center{ justify-content:center; }

  #screen-start{ width:100%; overflow-y:auto; padding:.5vh 4vw 26vh; }
  .title-big{ font-weight:800; font-size:clamp(26px,5vw,48px); letter-spacing:.05em; color:var(--terra-d); margin:.8vh 0 0; text-align:center; }
  .subtitle-big{ font-weight:700; font-size:clamp(13px,2vw,19px); margin:.4vh 0; text-align:center; }
  .intro{ display:flex; align-items:center; justify-content:center; gap:1.6vw; margin:.6vh 0 1.8vh; font-size:clamp(12.5px,1.7vw,16px); color:var(--muted); font-weight:700; text-align:center; }
  .mode-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2vw; width:100%; max-width:1040px; margin:0 auto; }
  @media (max-width:820px){ .mode-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:430px){ .mode-grid{ gap:2.6vw; } }
  .mode-card{ background:var(--panel); border:3px solid var(--edge); border-radius:20px; padding:1.8vh 1.4vw; display:flex; flex-direction:column; align-items:center; gap:.8vh; box-shadow:0 6px 0 rgba(58,50,38,.13); transition:transform .1s ease; min-height:150px; justify-content:center; }
  .mode-card:active{ transform:translateY(3px); box-shadow:0 3px 0 rgba(58,50,38,.13); }
  .mode-card .mi{ width:clamp(54px,8vw,74px); height:clamp(54px,8vw,74px); } .mode-card .mi svg{ width:100%; height:100%; }
  .mode-title{ font-weight:800; font-size:clamp(13.5px,1.9vw,18px); text-align:center; line-height:1.2; }
  .mode-sub{ font-size:clamp(11.5px,1.4vw,13.5px); color:var(--muted); font-weight:700; text-align:center; }
  .m-count{border-color:#8fb9c9} .m-hear{border-color:#d97e55} .m-build{border-color:#eec14a} .m-missing{border-color:#d98a92} .m-same{border-color:#8fa888} .m-mixed{border-color:#9a4a28}
  .brand-footer{ font-size:clamp(11px,1.3vw,13px); color:var(--muted); font-weight:700; text-align:center; margin-top:2vh; }

  #screen-sub{ gap:2vh; padding:6vh 4vw 26vh; text-align:center; }
  .sub-title{ font-weight:800; font-size:clamp(20px,3.2vw,30px); color:var(--terra-d); margin:0; }
  .sub-hint{ font-weight:700; font-size:clamp(13px,1.8vw,17px); color:var(--muted); margin:0; max-width:640px; }
  .sub-choices{ display:flex; gap:2.4vw; flex-wrap:wrap; justify-content:center; max-width:900px; }
  .sub-card{ background:var(--panel); border:3px solid var(--edge); border-radius:20px; padding:2.2vh 3vw; min-width:150px; min-height:96px; box-shadow:0 6px 0 rgba(58,50,38,.14); font-weight:800; font-size:clamp(15px,2.2vw,20px); display:flex; flex-direction:column; align-items:center; gap:1vh; }
  .sub-card:active{ transform:translateY(3px); box-shadow:0 3px 0 rgba(58,50,38,.14); }
  .sub-card .paws{ display:flex; gap:6px; color:var(--terra); } .sub-card .paw{ width:clamp(20px,3vw,28px); height:clamp(20px,3vw,28px); }
  .sub-card .big{ width:clamp(90px,14vw,130px); height:clamp(60px,9vw,84px); } .sub-card .big svg{ width:100%; height:100%; }
  .method-card{ min-width:clamp(150px,24vw,230px); }
  .method-card .sub-card-note{ font-size:clamp(12px,1.5vw,14px); font-weight:700; color:var(--muted); }

  #screen-game{ width:100%; gap:.5vh; padding:0 3vw 1vh; }
  .progress-row{ flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:1.4vw; padding-top:.3vh; flex-wrap:wrap; }
  .paws-row{ display:flex; gap:.9vw; align-items:center; }
  .paws-row .pw{ width:clamp(20px,3vw,28px); height:clamp(20px,3vw,28px); color:rgba(58,50,38,.2); transition:color .3s, transform .3s; } .paws-row .pw svg{ width:100%; height:100%; display:block; }
  .paws-row .pw.lit{ color:var(--terra); transform:scale(1.2); }
  .progress-num{ font-weight:800; font-size:clamp(12px,1.7vw,15px); background:var(--panel); border:2px solid var(--edge); border-radius:999px; padding:.4vh 2.6vw; }
  .task-wrap{ flex:1; min-height:0; width:100%; display:flex; align-items:stretch; justify-content:center; padding:.2vh 0; }
  .task-stage{ position:relative; border-radius:26px; width:100%; max-width:1100px; background:var(--panel); box-shadow:0 10px 26px -14px rgba(58,50,38,.4); display:flex; flex-direction:column; align-items:center; padding:.9vh 3vw 1vh; gap:.7vh; overflow-y:auto; overflow-x:hidden; border-top:8px solid var(--stage,#eec14a); }
  .station-chip{ position:absolute; top:6px; left:10px; display:flex; align-items:center; gap:6px; font-size:clamp(10.5px,1.3vw,12.5px); font-weight:800; color:var(--muted); }
  .station-chip svg{ width:clamp(22px,3vw,30px); height:clamp(22px,3vw,30px); }
  .prompt-row{ flex-shrink:0; display:flex; align-items:center; gap:1.6vw; margin-top:1.1vh; }
  .prompt-text{ font-weight:800; font-size:clamp(17px,2.6vw,26px); text-align:center; }
  .spk{ flex-shrink:0; width:clamp(48px,6vw,60px); height:clamp(48px,6vw,60px); border-radius:50%; background:#fdf0c4; border:3px solid var(--gelb-d); color:var(--gelb-d); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 rgba(143,108,12,.35); }
  .spk:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(143,108,12,.35); }
  .spk .spk-ico{ width:58%; height:58%; }
  .spk.small{ width:clamp(44px,5vw,52px); height:clamp(44px,5vw,52px); border-width:2.5px; }
  .task-body{ flex:1 0 auto; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2vh; }
  .col-left,.col-right{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2vh; width:100%; min-width:0; }
  .feedback-msg{ flex-shrink:0; font-weight:800; font-size:clamp(14px,1.9vw,18px); color:var(--rosa-d); text-align:center; min-height:1.9em; opacity:0; transition:opacity .2s; }
  .feedback-msg.show{ opacity:1; } .feedback-msg.good{ color:var(--salbei-d); }

  .pic-row{ display:flex; align-items:center; gap:2vw; justify-content:center; }
  .pic{ width:clamp(110px,23vh,230px); height:clamp(110px,23vh,230px); background:#fffdf8; border:3px solid var(--edge); border-radius:24px; padding:10px; }
  .pic.mid{ width:clamp(90px,17vh,190px); height:clamp(90px,17vh,190px); }
  .pic svg{ width:100%; height:100%; display:block; }
  .word-label{ font-weight:800; font-size:clamp(20px,3.4vw,32px); letter-spacing:.08em; text-align:center; }
  .num-row{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:2vw; width:min(100%,640px); }
  .num-btn{ background:var(--panel); border:3px solid var(--edge); border-radius:20px; min-height:clamp(60px,10vh,92px); font-weight:800; font-size:clamp(28px,5vw,46px); box-shadow:0 5px 0 rgba(58,50,38,.14); }
  .num-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(58,50,38,.14); }
  .num-btn.shake,.opt-btn.shake,.card-btn.shake{ animation:shake .4s ease; border-color:var(--rosa-d); }
  .num-btn.good,.opt-btn.good,.card-btn.good{ animation:pulse .5s ease; border-color:var(--salbei-d); background:#e3efdd; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

  .method-switch{ display:flex; gap:6px; background:#f3ead2; border-radius:999px; padding:4px; }
  .method-switch button{ font-weight:800; font-size:clamp(12px,1.5vw,14px); padding:.6vh 2.4vw; border-radius:999px; min-height:44px; color:var(--muted); }
  .method-switch button[aria-pressed="true"]{ background:var(--panel); color:var(--ink); box-shadow:0 2px 0 rgba(58,50,38,.15); }
  .tap-zone{ background:#fff7e0; border:3px dashed var(--terra); border-radius:26px; width:min(100%,520px); display:flex; align-items:center; justify-content:center; padding:1vh 2vw; min-height:clamp(84px,13vh,150px); box-shadow:0 5px 0 rgba(58,50,38,.12); }
  .tap-zone:active{ transform:translateY(3px); }
  .tap-zone svg{ height:clamp(62px,10.5vh,112px); width:auto; max-width:100%; display:block; }
  .tap-zone .hl,.tap-zone .hr{ transition:transform .12s; } .tap-zone.clap.pop .hl,.tap-zone.clap.pop .hr{ transform:translateX(11px); }
  .swing-hand{ transform:translate(62px,14px) scale(1.2); } .tap-zone.swing.pop .swing-hand{ animation:swingmove .45s ease; }
  @keyframes swingmove{ 0%{ transform:translate(26px,44px) scale(1.2) } 50%{ transform:translate(62px,-4px) scale(1.2) } 100%{ transform:translate(62px,14px) scale(1.2) } }
  .marks{ display:flex; gap:10px; min-height:clamp(36px,5.6vh,60px); align-items:center; justify-content:center; flex-wrap:wrap; }
  .mark-dot{ width:clamp(28px,min(4.6vw,5vh),44px); height:clamp(28px,min(4.6vw,5vh),44px); border-radius:50%; background:var(--terra); animation:pop .25s ease; }
  .mark-arc{ width:clamp(48px,min(7.6vw,9vh),76px); height:clamp(26px,min(4.2vw,5vh),42px); animation:pop .25s ease; }
  @keyframes pop{ from{ transform:scale(.4); opacity:.2 } to{ transform:scale(1); opacity:1 } }
  .btn-row{ display:flex; gap:2.4vw; align-items:center; justify-content:center; flex-wrap:wrap; position:sticky; bottom:0; z-index:3; padding:.6vh 0; background:linear-gradient(180deg,rgba(255,252,245,0),var(--panel) 28%); width:100%; }
  .btn-big{ font-weight:800; font-size:clamp(16px,2.3vw,22px); color:#fff; background:var(--terra-d); border-radius:999px; padding:1.1vh 6vw; min-height:52px; box-shadow:0 6px 0 #6f3519; }
  .btn-big:active{ transform:translateY(3px); box-shadow:0 3px 0 #6f3519; }
  .btn-ghost{ font-weight:800; font-size:clamp(14px,1.9vw,18px); background:var(--panel); border:3px solid var(--edge); border-radius:999px; padding:.9vh 3.6vw; min-height:50px; display:flex; align-items:center; gap:8px; }
  .btn-ghost svg{ width:22px; height:22px; }

  .slots{ display:flex; gap:clamp(8px,1.6vw,16px); justify-content:center; flex-wrap:wrap; }
  .slot{ min-width:clamp(78px,13vw,128px); height:clamp(56px,9vh,86px); border:3px dashed var(--edge); border-radius:18px; background:#fffaf0; display:flex; align-items:center; justify-content:center; position:relative; }
  .slot.over{ border-color:var(--terra-d); background:#fff0d6; }
  .slot .ghost{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:clamp(22px,3.6vw,36px); letter-spacing:.06em; color:rgba(58,50,38,.3); pointer-events:none; }
  .slot-n{ position:absolute; top:-12px; left:-8px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .chips{ display:flex; gap:clamp(10px,1.8vw,18px); justify-content:center; flex-wrap:wrap; min-height:clamp(56px,9vh,86px); width:100%; }
  .chip{ min-width:clamp(78px,13vw,128px); height:clamp(56px,9vh,86px); padding:0 1.6vw; background:#fdf0c4; border:3px solid var(--gelb-d); border-radius:18px; font-weight:800; font-size:clamp(22px,3.6vw,36px); letter-spacing:.06em; box-shadow:0 5px 0 rgba(143,108,12,.35); touch-action:none; cursor:grab; display:flex; align-items:center; justify-content:center; }
  .slot .chip{ box-shadow:none; height:calc(100% - 6px); min-width:calc(100% - 6px); }
  .chip.dragging{ opacity:.25; } .chip:active{ cursor:grabbing; }
  .drag-ghost{ position:fixed; z-index:50; pointer-events:none; opacity:.95; transform:translate(-50%,-50%) scale(1.06); box-shadow:0 12px 24px -8px rgba(58,50,38,.5); }
  .syl-row{ display:flex; gap:clamp(8px,1.6vw,16px); justify-content:center; align-items:center; flex-wrap:wrap; }
  .syl{ min-width:clamp(78px,13vw,128px); height:clamp(56px,9vh,86px); padding:0 1.4vw; display:flex; align-items:center; justify-content:center; background:#f3ead2; border-radius:18px; font-weight:800; font-size:clamp(22px,3.6vw,36px); letter-spacing:.06em; }
  .syl.blank{ background:#fffaf0; border:3px dashed var(--terra-d); color:var(--terra-d); }
  .syl.filled{ background:#e3efdd; border:3px solid var(--salbei-d); }
  .syl-dash{ font-weight:800; font-size:clamp(20px,3vw,30px); color:var(--muted); }
  .opt-row{ display:flex; gap:clamp(10px,2vw,22px); justify-content:center; flex-wrap:wrap; }
  .opt-btn{ min-width:clamp(88px,15vw,150px); height:clamp(58px,9.6vh,92px); padding:0 2vw; background:#fdf0c4; border:3px solid var(--gelb-d); border-radius:20px; font-weight:800; font-size:clamp(24px,4vw,40px); letter-spacing:.06em; box-shadow:0 5px 0 rgba(143,108,12,.35); }
  .opt-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(143,108,12,.35); }
  .target-tile{ background:#fdf0c4; border:4px solid var(--gelb-d); border-radius:24px; padding:1vh 5vw; font-weight:800; font-size:clamp(34px,6.4vw,64px); letter-spacing:.08em; display:flex; align-items:center; gap:clamp(8px,1.6vw,16px); box-shadow:0 6px 0 rgba(143,108,12,.35); }
  .cards-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(10px,1.8vw,20px); width:min(100%,960px); }
  @media (max-width:640px){ .cards-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .card{ position:relative; }
  .card-btn{ width:100%; background:var(--panel); border:3px solid var(--edge); border-radius:20px; padding:1vh 1vw 1.2vh; display:flex; flex-direction:column; align-items:center; gap:.5vh; box-shadow:0 5px 0 rgba(58,50,38,.14); }
  .card-btn:active{ transform:translateY(3px); }
  .card-btn svg{ width:clamp(64px,12vh,130px); height:clamp(64px,12vh,130px); }
  .card-btn .cw{ font-weight:800; font-size:clamp(15px,2.2vw,22px); letter-spacing:.06em; }
  .card .spk{ position:absolute; top:6px; right:6px; z-index:2; }

  #screen-end{ gap:1.6vh; text-align:center; padding:3vh 4vw 26vh; overflow-y:auto; width:100%; }
  .end-scene{ width:min(86vw,520px); height:auto; border-radius:22px; box-shadow:0 10px 26px -14px rgba(58,50,38,.5); }
  .end-title{ font-weight:800; font-size:clamp(24px,4.4vw,42px); letter-spacing:.04em; margin:0; color:var(--terra-d); }
  .end-sub{ font-weight:700; font-size:clamp(14px,2vw,19px); margin:0; color:var(--muted); }
  .end-actions{ display:flex; gap:3vw; margin-top:.5vh; flex-wrap:wrap; justify-content:center; }
  @media (max-width:560px){ .end-actions{ flex-direction:column; width:100%; align-items:center; } }
  @media (max-height:700px){ .brand span{ display:none; } header{ padding:.5vh 3vw 0; } .progress-row{ gap:1vw; } .title-big{ margin-top:0; } }
  @media (orientation:landscape) and (max-height:800px) and (min-width:640px){
    .task-body.two-col{ flex-direction:row; align-items:center; justify-content:center; gap:3vw; }
    .task-body.two-col .col-left{ width:auto; flex:0 0 auto; }
    .task-body.two-col .col-right{ flex:1 1 0; max-width:620px; }
    .task-body.two-col .pic,.task-body.two-col .pic.mid{ width:clamp(90px,26vh,170px); height:clamp(90px,26vh,170px); }
    .task-body.two-col .num-row{ width:100%; }
  }
  @media (max-height:600px){ .mode-card{ min-height:112px; } }
  @media (max-height:460px){ header{ position:fixed; top:4px; right:6px; z-index:6; padding:0; } .progress-row{ padding-top:.6vh; padding-right:58px; } .prompt-row{ margin-top:.4vh; } .prompt-text{ font-size:clamp(15px,2.2vw,20px); } .station-chip{ display:none; } .task-stage{ border-top-width:5px; padding-top:.6vh; } .feedback-msg{ min-height:1.3em; } .syl,.slot,.chip{ height:50px; min-width:70px; font-size:22px; } .opt-btn{ height:50px; min-width:76px; font-size:22px; padding:0 14px; } .opt-row{ gap:10px; } }
  @media (max-width:480px){ .pill-btn{ padding:.6vh 3.2vw; font-size:12.5px; } }
</style>
</head>
<body>
<div class="sun" aria-hidden="true"></div>
<div class="scene" id="scene" aria-hidden="true"></div>

<header>
  <div class="brand" id="brand"></div>
  <button class="icon-btn" id="btn-sound" aria-label="Ton an oder aus" aria-pressed="true">🔊</button>
</header>

<div class="screen" id="screen-start">
  <h1 class="title-big">SILBEN-SAFARI</h1>
  <p class="subtitle-big">Wörter hören, zerlegen &amp; zusammensetzen</p>
  <div class="intro"><button class="spk small" id="btn-intro-speak" aria-label="Erklärung vorlesen"></button><span>Tippe auf ein Spiel. Mit dem Lautsprecher hörst du jedes Wort.</span></div>
  <div class="mode-grid" id="mode-grid"></div>
  <p class="brand-footer">Förderfreude Games</p>
</div>

<div class="screen screen-center" id="screen-sub" hidden>
  <button class="pill-btn" id="btn-sub-back" style="position:absolute; left:3vw; top:1vh;">← Zurück</button>
  <h2 class="sub-title" id="sub-title"></h2>
  <p class="sub-hint" id="sub-hint"></p>
  <div class="sub-choices" id="sub-choices"></div>
</div>

<div class="screen" id="screen-game" hidden>
  <div class="progress-row">
    <button class="pill-btn" id="btn-game-back">← Zurück</button>
    <div class="paws-row" id="paws" role="img" aria-label="Fortschritt"></div>

/* ===== SILBEN-SAFARI: Aufgabenlogik ===== */
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
const GEN = { used:new Set(), shown:new Set(), posCount:{}, stats:{tries:0, fallbacks:0} };
function resetGen(){ GEN.used=new Set(); GEN.shown=new Set(); GEN.posCount={}; }

/* ---------- Wortpools je Stufe/Aufgabenart ---------- */
const byD = d => WORDS.filter(w=>w.d===d);
const D0=byD(0), D1=byD(1), D2=byD(2), D3=byD(3), D2_3=WORDS.filter(w=>w.d===2&&w.n===3);
function poolsFor(level, kind){
  if(kind==='build'||kind==='missing'||kind==='same'){          // brauchen mindestens 2 Silben
    if(level==='leicht') return [[D1,1]];
    if(level==='mittel') return [[D2,0.85],[D1,0.15]];
    return [[D3,0.8],[D2_3,0.2]];
  }
  if(level==='leicht') return [[D1,0.8],[D0,0.2]];               // ueberwiegend klare zweisilbige Woerter
  if(level==='mittel') return [[D2,0.8],[D1,0.2]];               // 2-3 Silben
  return [[D3,0.75],[D2_3,0.25]];                                // 3-4 Silben
}
function pickWord(level, kind, filter){
  const pools=poolsFor(level,kind);
  const attempt=avoid=>{
    for(let i=0;i<150;i++){
      let r=Math.random(), acc=0, list=pools[pools.length-1][0];
      for(const [l,wt] of pools){ acc+=wt; if(r<=acc){ list=l; break; } }
      const w=pick(list); GEN.stats.tries++;
      if(filter && !filter(w)) continue;
      if(avoid && (GEN.used.has(w.id)||GEN.shown.has(w.id))) continue;
      return w;
    }
    return null;
  };
  const w = attempt(true) || (GEN.stats.fallbacks++, attempt(false));
  if(!w) throw new Error('Kein passendes Wort ('+level+'/'+kind+')');
  GEN.used.add(w.id); GEN.shown.add(w.id); return w;
}

/* ---------- Silbenvorrat fuer Ablenker ---------- */
const SYL_DATA = [...new Set(WORDS.flatMap(w=>w.s))];
const CONS = ['b','d','f','g','h','k','l','m','n','p','r','s','t','w','z'], VOW = ['a','e','i','o','u'];
const CV_SYL = CONS.flatMap(c=>VOW.map(v=>c+v));
const nucleus = s => (/[aeiouäöüy]+/.exec(s)||[''])[0];
function formedWord(w, idx, syl){ const a=w.s.slice(); a[idx]=syl; return a.join(''); }
function isRealOrData(str){ return REAL_SET.has(str) || WORDS.some(x=>x.s.join('')===str); }
function distractorSyllables(w, idx, count, similar){
  const correct=w.s[idx], others=new Set(w.s);
  const universe=[...new Set([...SYL_DATA, ...CV_SYL])].filter(s=>s!==correct && !others.has(s));
  const valid=s=>{ const f=formedWord(w,idx,s); return f!==w.s.join('') && !isRealOrData(f); };
  const out=[]; const take=list=>{ for(const s of shuffle(list)){ if(out.length>=count) break; if(!out.includes(s)) out.push(s); } };
  // Laengenunterschied schrittweise lockern, bis genug eindeutige Ablenker vorhanden sind
  for(const maxDiff of [1,2,3,5]){
    const pool=universe.filter(s=>Math.abs(s.length-correct.length)<=maxDiff && valid(s));
    const strong=pool.filter(s=> similar ? (s[0]===correct[0] || nucleus(s)===nucleus(correct)) : (s[0]!==correct[0] && nucleus(s)!==nucleus(correct)));
    take(strong); if(out.length<count) take(pool);
    if(out.length>=count) break;
  }
  return out;
}

/* ---------- Aufgabenarten ---------- */
function genCount(level){
  const w=pickWord(level,'count');
  return { kind:'count', level, word:w, prompt:PROMPTS.count, options:shuffle([1,2,3,4]), answer:w.n, needsReading:false };
}
function genHear(level){
  const w=pickWord(level,'hear');
  return { kind:'hear', level, word:w, prompt:PROMPTS.hear, answer:w.n, needsReading:false };
}
function genBuild(level){
  const w=pickWord(level,'build', x=>x.n>=2);
  const chips=w.sylUp.map((t,i)=>({id:i,text:t}));
  let sh=shuffle(chips), tries=0;
  while(sh.map(c=>c.text).join('|')===w.sylUp.join('|') && tries++<60) sh=shuffle(chips);
  return { kind:'build', level, word:w, prompt:PROMPTS.build, chips:sh, ghost:level==='leicht', needsReading: level!=='leicht' };
}
function genMissing(level){
  const w=pickWord(level,'missing', x=>x.n>=2);
  // Position der fehlenden Silbe abwechseln (Anfang / Mitte / Ende)
  const key=n=>'p'+n; let best=[], bestC=1e9;
  for(let i=0;i<w.n;i++){ const c=GEN.posCount[key(i===0?'a':(i===w.n-1?'e':'m'))]||0; if(c<bestC){ bestC=c; best=[i]; } else if(c===bestC) best.push(i); }
  const idx=pick(best); GEN.posCount[key(idx===0?'a':(idx===w.n-1?'e':'m'))]=(GEN.posCount[key(idx===0?'a':(idx===w.n-1?'e':'m'))]||0)+1;
  const nOpt = level==='schwer' ? 4 : 3;
  const dis=distractorSyllables(w, idx, nOpt-1, level==='schwer');
  const correct=w.s[idx];
  const options=shuffle([correct, ...dis]);
  return { kind:'missing', level, word:w, idx, prompt:PROMPTS.missing, options:options.map(s=>s.toUpperCase()), answer:correct.toUpperCase(), needsReading:true };
}
function genSame(level){
  const poolAll=WORDS.filter(x=>x.n>=2);
  for(let attempt=0; attempt<400; attempt++){
    const relaxGroups = attempt>250, relaxSeen = attempt>150;
    const w=pick(poolsFor(level,'same').flatMap(p=>p[0]).filter(x=>x.n>=2));
    if(attempt<150 && (GEN.used.has(w.id))) continue;
    const idx = level==='mittel' ? pick([0,w.n-1]) : randInt(0,w.n-1);
    const target=w.s[idx]; if(target.length<2) continue;
    const lowTarget=target.toLowerCase();
    let cands=poolAll.filter(x=>x.id!==w.id && !x.w.toLowerCase().includes(lowTarget) && !x.s.includes(lowTarget));
    if(!relaxSeen) cands=cands.filter(x=>!GEN.shown.has(x.id));
    // aehnlich aussehende Bilder nie gemeinsam
    const chosen=[]; const groups=new Set(w.g?[w.g]:[]);
    for(const c of shuffle(cands)){ if(chosen.length>=3) break; if(!relaxGroups && c.g && groups.has(c.g)) continue; if(c.g) groups.add(c.g); chosen.push(c); }
    if(chosen.length<3) continue;
    GEN.used.add(w.id); GEN.shown.add(w.id); chosen.forEach(c=>GEN.shown.add(c.id));
    return { kind:'same', level, word:w, idx, target:lowTarget, targetUp:target.toUpperCase(), options:shuffle([w,...chosen]), answerId:w.id, prompt:PROMPTS.same, needsReading:true };
  }
  throw new Error('Keine "gleiche Silbe"-Aufgabe erzeugbar ('+level+')');
}
const GENERATORS = { count:genCount, hear:genHear, build:genBuild, missing:genMissing, same:genSame };

/* ---------- Rundenplan ---------- */
function makePlan(kinds, n, maxRun){
  const base=Math.floor(n/kinds.length), extra=n%kinds.length, bag=[];
  shuffle(kinds).forEach((k,i)=>{ const c=base+(i<extra?1:0); for(let j=0;j<c;j++) bag.push(k); });
  for(let t=0;t<400;t++){ const s=shuffle(bag); let ok=true, run=1; for(let i=1;i<s.length;i++){ run=s[i]===s[i-1]?run+1:1; if(run>maxRun){ ok=false; break; } } if(ok) return s; }
  return shuffle(bag);
}
function mixedKinds(level){ return level==='leicht' ? ['count','hear','build'] : ['count','hear','build','missing','same']; }
// Aufgaben pro Modus und Stufe, die Lesen einzelner Silben voraussetzen
function modeAllowedLevels(mode){ return mode==='missing'||mode==='same' ? ['mittel','schwer'] : ['leicht','mittel','schwer']; }

let timers=[]; function after(ms,fn){ const id=setTimeout(()=>{ timers=timers.filter(t=>t!==id); try{ fn(); }catch(e){ state.locked=false; } },ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
let lockedSince=null; setInterval(()=>{ if(state.locked){ if(lockedSince===null) lockedSince=Date.now(); else if(Date.now()-lockedSince>5000){ state.locked=false; lockedSince=null; } } else lockedSince=null; },500);

const els = { start:$('screen-start'), sub:$('screen-sub'), game:$('screen-game'), end:$('screen-end'), grid:$('mode-grid'), subTitle:$('sub-title'), subHint:$('sub-hint'), subChoices:$('sub-choices'),

/* ---------- Sprachausgabe: immer das VOLLSTAENDIGE Wort, nie getrennte Silben ---------- */
let voices=[]; function loadVoices(){ try{ voices=window.speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
function speechOk(){ try{ return 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance!=='undefined' && !!window.speechSynthesis; }catch(e){ return false; } }
try{ if(speechOk()){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; } }catch(e){}
function say(text){
  try{ if(!speechOk()) return; window.speechSynthesis.cancel(); const u=new window.SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=0.85;
    const v=voices.find(x=>/^de/i.test(x.lang)); if(v) u.voice=v; window.speechSynthesis.speak(u); }catch(e){}
}
function stopSay(){ try{ if(speechOk()) window.speechSynthesis.cancel(); }catch(e){} }
function spkButton(label, small){ const b=document.createElement('button'); b.className='spk'+(small?' small':''); b.setAttribute('aria-label',label); b.innerHTML=SPEAKER; return b; }
$('btn-intro-speak').innerHTML=SPEAKER; $('btn-prompt-speak').innerHTML=SPEAKER;

  {key:'hear',    title:'Silben hören',             sub:'Klatschen oder schwingen',  station:'hear', method:true},
  {key:'build',   title:'Baue das Wort!',           sub:'Silben ordnen',             station:'build'},
  {key:'missing', title:'Welche Silbe fehlt?',      sub:'Lücke füllen',              station:'missing'},
  {key:'same',    title:'Finde die gleiche Silbe!', sub:'Silben vergleichen',        station:'same'},
  {key:'mixed',   title:'Silben-Safari gemischt',   sub:'Alles zusammen',            station:'mixed'}
];
const STATION_NAME = { count:'Fernglas-Station', hear:'Trommel-Platz', build:'Bau-Station', missing:'Schilder-Station', same:'Foto-Station', mixed:'Jeep-Tour' };
const STAGE_COLOR = { count:'#8fb9c9', hear:'#d97e55', build:'#eec14a', missing:'#d98a92', same:'#8fa888', mixed:'#9a4a28' };

function buildStart(){
  els.grid.innerHTML='';
  MODES.forEach(m=>{ const b=document.createElement('button'); b.className='mode-card m-'+m.key; b.innerHTML=`<div class="mi">${stationSvg(m.station)}</div><div class="mode-title">${m.title}</div><div class="mode-sub">${m.sub}</div>`; b.addEventListener('click',()=>onMode(m.key)); els.grid.appendChild(b); });
  if(!speechOk()){ const p=document.createElement('p'); p.className='brand-footer'; p.id='no-speech-note'; p.textContent='Hinweis: Auf diesem Gerät gibt es keine Sprachausgabe. Die Wörter stehen dann geschrieben da.'; els.start.appendChild(p); }

let subSteps=[], subIdx=0;
function onMode(key){
  clearTimers(); stopSay(); state.mode=key; state.level=null;
  subSteps = modeByKey(key).method ? ['method','level'] : ['level']; subIdx=0;
  showSub(); els.start.hidden=true; els.sub.hidden=false; els.game.hidden=true; els.end.hidden=true;
}
function showSub(){
  const kind=subSteps[subIdx], m=modeByKey(state.mode); els.subChoices.innerHTML='';
  if(kind==='method'){
    els.subTitle.textContent='Wie möchtest du die Silben entdecken?'; els.subHint.textContent='';
    [['klatschen','Klatschen',HANDS_SVG],['schwingen','Schwingen',SWING_SVG]].forEach(([k,l,svg])=>{

      b.addEventListener('click',()=>{ state.method=k; subIdx++; showSub(); }); els.subChoices.appendChild(b); });
  } else {
    els.subTitle.textContent=m.title; const allowed=modeAllowedLevels(state.mode==='mixed'?'mixed':state.mode);
    els.subHint.textContent = allowed.length<3 ? 'Hier liest du Silben. Das Spiel beginnt bei „Mittel“.' : 'Wie schwer soll es sein?';
    LEVELS.filter(l=>allowed.includes(l.key)).forEach(l=>{ const b=document.createElement('button'); b.className='sub-card'; b.dataset.level=l.key;

}

$('btn-sound').addEventListener('click',()=>{ state.soundOn=!state.soundOn; $('btn-sound').textContent=state.soundOn?'🔊':'🔇'; $('btn-sound').setAttribute('aria-pressed',String(state.soundOn)); });

/* ---------- Runde ---------- */
function buildPaws(){ els.paws.innerHTML=''; for(let i=0;i<ROUND_TARGET;i++){ const d=document.createElement('span'); d.className='pw'; d.innerHTML=PAW; els.paws.appendChild(d); } }
function startRound(){
  clearTimers(); stopSay(); resetGen(); state.progress=0; state.locked=false; state.planIdx=0;
  state.plan = state.mode==='mixed' ? makePlan(mixedKinds(state.level), ROUND_TARGET, 1) : Array(ROUND_TARGET).fill(state.mode);
  els.start.hidden=true; els.sub.hidden=true; els.end.hidden=true; els.game.hidden=false; els.count.textContent='0'; buildPaws(); newTask();
}
function onSuccess(){
  state.progress=Math.min(ROUND_TARGET,state.progress+1); els.count.textContent=state.progress;
  const p=els.paws.children[state.progress-1]; if(p) p.classList.add('lit');
  chime();
  if(state.progress>=ROUND_TARGET) after(650,endRound); else after(650,()=>newTask());
}
function endRound(){ clearTimers(); stopSay(); els.game.hidden=true; els.end.hidden=false; $('end-art').innerHTML=END_SCENE; fanfare(); }
function newTask(){
  state.locked=false; els.fb.classList.remove('show','good'); els.fb.textContent='';
  const kind = state.plan[state.planIdx++] || state.mode;
  const t = GENERATORS[kind](state.level); state.task=t; renderTask(t);
}
function showFb(msg,good){ els.fb.textContent=msg; els.fb.classList.toggle('good',!!good); els.fb.classList.add('show'); }
function okFb(){ showFb(pick(GOOD),true); }
function hintFb(kind){ showFb(pick(HINTS[kind]),false); }
function shake(el){ el.classList.add('shake'); after(450,()=>el.classList.remove('shake')); }
function win(el){ state.locked=true; if(el) el.classList.add('good'); okFb(); onSuccess(); }

/* ---------- Ton (nur kurze Effekte, abschaltbar) ---------- */
let actx=null; document.addEventListener('pointerdown',()=>{ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },{once:true});
function tone(f,d,delay,gain){ if(!state.soundOn||!actx) return; try{ const t0=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain||.1,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+d); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+d+.03); }catch(e){} }
function chime(){ tone(660,.18,0,.08); tone(880,.22,.1,.08); }
function fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,.3,i*.12,.1)); }

/* ---------- Darstellung ---------- */
const wordBtn = (w,small)=>{ const b=spkButton('Wort anhören',small); b.dataset.word=w.w; b.addEventListener('click',e=>{ e.stopPropagation(); say(w.w); }); return b; };
const picEl = (w,cls)=>{ const d=document.createElement('div'); d.className='pic '+(cls||''); d.innerHTML=artSvg(w.art); d.setAttribute('role','img'); d.setAttribute('aria-label','Bild: '+w.w); return d; };
function renderTask(t){
  els.body.innerHTML=''; els.body.className='task-body'; els.stage.style.setProperty('--stage',STAGE_COLOR[t.kind]);
  els.chip.innerHTML=`${stationSvg(t.kind)}<span>${STATION_NAME[t.kind]}</span>`;
  els.prompt.textContent=t.prompt; els.btnPrompt.onclick=()=>say(t.prompt);
  ({count:renderCount,hear:renderHear,build:renderBuild,missing:renderMissing,same:renderSame})[t.kind](t);
  els.stage.scrollTop=0;
}
function twoCol(){ const l=document.createElement('div'); l.className='col-left'; const r=document.createElement('div'); r.className='col-right'; els.body.classList.add('two-col'); els.body.appendChild(l); els.body.appendChild(r); return [l,r]; }
function picRow(t,cls){ const r=document.createElement('div'); r.className='pic-row'; r.appendChild(picEl(t.word,cls)); r.appendChild(wordBtn(t.word,false)); return r; }

function renderCount(t){
  const [L,R]=twoCol(); L.appendChild(picRow(t));
  const lab=document.createElement('div'); lab.className='word-label'; lab.textContent=t.word.up; L.appendChild(lab);
  const row=document.createElement('div'); row.className='num-row';
  t.options.forEach(n=>{ const b=document.createElement('button'); b.className='num-btn'; b.textContent=String(n); b.dataset.value=n; b.setAttribute('aria-label',n===1?'1 Silbe':n+' Silben');
    b.addEventListener('click',()=>{ if(state.locked) return; if(n===t.answer) win(b); else { shake(b); hintFb('count'); } }); row.appendChild(b); });
  R.appendChild(row);
}

function renderHear(t){
  let taps=0; const marks=document.createElement('div'); marks.className='marks'; marks.setAttribute('aria-live','polite');
  const [L,R]=twoCol(); L.appendChild(picRow(t,'mid'));
  if(!speechOk()){ const lab=document.createElement('div'); lab.className='word-label'; lab.textContent=t.word.up; L.appendChild(lab); }   // ohne Sprachausgabe: Wort sichtbar
  const sw=document.createElement('div'); sw.className='method-switch'; sw.setAttribute('role','group'); sw.setAttribute('aria-label','Methode wählen');
  ['klatschen','schwingen'].forEach(k=>{ const b=document.createElement('button'); b.textContent=k==='klatschen'?'Klatschen':'Schwingen'; b.dataset.method=k; b.setAttribute('aria-pressed',String(state.method===k));
    b.addEventListener('click',()=>{ if(state.method===k) return; state.method=k; resetZone(); sw.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.method===k))); }); sw.appendChild(b); });
  L.appendChild(sw);
  const zone=document.createElement('button'); zone.className='tap-zone'; zone.id='tap-zone'; R.appendChild(zone); R.appendChild(marks);
  const row=document.createElement('div'); row.className='btn-row';
  const undo=document.createElement('button'); undo.className='btn-ghost'; undo.id='btn-undo'; undo.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9,7 L4,12 L9,17 M4,12 H15 A5,5 0 0 1 15,22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-3)"/></svg><span>Rückgängig</span>';
  const done=document.createElement('button'); done.className='btn-big'; done.id='btn-done'; done.textContent='Fertig';
  row.appendChild(undo); row.appendChild(done); R.appendChild(row);
  function markEl(){ const s=document.createElement('span'); if(state.method==='klatschen'){ s.className='mark-dot'; s.setAttribute('aria-label','Klatscher'); } else { s.className='mark-arc'; s.innerHTML='<svg viewBox="0 0 80 44" aria-hidden="true"><path d="M6,8 Q40,60 74,8" fill="none" stroke="#9a4a28" stroke-width="7" stroke-linecap="round"/></svg>'; s.setAttribute('aria-label','Silbenbogen'); } return s; }
  function paintZone(){ zone.className='tap-zone '+(state.method==='klatschen'?'clap':'swing'); zone.innerHTML = state.method==='klatschen'?HANDS_SVG:SWING_SVG; zone.setAttribute('aria-label', state.method==='klatschen'?'Tippen: ein Klatscher pro Silbe':'Tippen: ein Bogen pro Silbe'); }
  function resetZone(){ taps=0; marks.innerHTML=''; paintZone(); }
  zone.addEventListener('click',()=>{ if(state.locked) return; if(taps>=8) return; taps++; marks.appendChild(markEl()); zone.classList.add('pop'); after(160,()=>zone.classList.remove('pop')); });
  undo.addEventListener('click',()=>{ if(state.locked||taps===0) return; taps--; marks.removeChild(marks.lastChild); });
  done.addEventListener('click',()=>{ if(state.locked) return; if(taps===t.answer) win(done); else { hintFb('hear'); shake(done); resetZone(); } });
  resetZone();
}

function renderBuild(t){
  const n=t.word.n, chips=t.chips.map((c,i)=>({uid:i,text:c.text})); const slots=Array(n).fill(null);
  const [L,R]=twoCol(); L.appendChild(picRow(t,'mid'));
  const slotsEl=document.createElement('div'); slotsEl.className='slots'; slotsEl.id='slots'; const poolEl=document.createElement('div'); poolEl.className='chips'; poolEl.id='chip-pool';
  R.appendChild(slotsEl); R.appendChild(poolEl);
  const txt=uid=>chips.find(c=>c.uid===uid).text;
  function check(){ if(state.locked||slots.some(x=>x===null)) return; const joined=slots.map(txt).join(''); if(joined===t.word.sylUp.join('')){ slotsEl.querySelectorAll('.chip').forEach(c=>c.classList.add('good')); win(null); } else { hintFb('build'); } }
  const api={
    tap(uid){ if(state.locked) return; const i=slots.indexOf(uid); if(i>=0) slots[i]=null; else { const e=slots.indexOf(null); if(e<0) return; slots[e]=uid; } paint(); check(); },
    drop(uid,target){ if(state.locked) return; const from=slots.indexOf(uid);
      if(target==='pool'){ if(from>=0) slots[from]=null; }
      else if(typeof target==='number'){ const occ=slots[target]; if(occ===uid) { paint(); return; } slots[target]=uid; if(from>=0) slots[from]=occ; }
      paint(); check(); }
  };
  function makeChip(uid){ const b=document.createElement('button'); b.className='chip'; b.textContent=txt(uid); b.dataset.uid=uid; b.setAttribute('aria-label','Silbe '+txt(uid)); attachDrag(b,uid,api); return b; }
  function paint(){
    slotsEl.innerHTML=''; slots.forEach((uid,i)=>{ const s=document.createElement('div'); s.className='slot'; s.dataset.slot=i; const num=document.createElement('span'); num.className='slot-n'; num.textContent=String(i+1); s.appendChild(num);
      if(t.ghost){ const g=document.createElement('span'); g.className='ghost'; g.textContent=t.word.sylUp[i]; s.appendChild(g); }
      if(uid!==null) s.appendChild(makeChip(uid)); slotsEl.appendChild(s); });
    poolEl.innerHTML=''; chips.forEach(c=>{ if(!slots.includes(c.uid)) poolEl.appendChild(makeChip(c.uid)); });
  }
  paint();
}
/* Ziehen mit Maus und Finger; Antippen als Alternative (auch Tastatur) */
function attachDrag(el,uid,api){
  let sx=0, sy=0, dragging=false, ghost=null, pid=null;
  const clear=()=>{ if(ghost){ ghost.remove(); ghost=null; } document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over')); el.classList.remove('dragging'); };
  const targetAt=(x,y)=>{ const e=document.elementFromPoint(x,y); if(!e) return null; const s=e.closest('.slot'); if(s) return +s.dataset.slot; if(e.closest('#chip-pool')) return 'pool'; return null; };
  el.addEventListener('pointerdown',e=>{ if(state.locked||(e.button!==undefined&&e.button!==0)) return; sx=e.clientX; sy=e.clientY; dragging=false; pid=e.pointerId; try{ el.setPointerCapture(pid); }catch(_){} });
  el.addEventListener('pointermove',e=>{ if(pid===null||e.pointerId!==pid) return;
    if(!dragging && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ dragging=true; ghost=el.cloneNode(true); ghost.classList.add('drag-ghost'); document.body.appendChild(ghost); el.classList.add('dragging'); }
    if(dragging){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over')); const tg=targetAt(e.clientX,e.clientY); if(typeof tg==='number'){ const s=document.querySelector(`.slot[data-slot="${tg}"]`); if(s) s.classList.add('over'); } } });
  const end=(e,cancel)=>{ if(pid===null||e.pointerId!==pid) return; const was=dragging; const tg=was?targetAt(e.clientX,e.clientY):null; pid=null; dragging=false; clear(); if(cancel) return; if(was){ if(tg===null) return; api.drop(uid,tg); } else api.tap(uid); };
  el.addEventListener('pointerup',e=>end(e,false)); el.addEventListener('pointercancel',e=>end(e,true));
  el.addEventListener('click',e=>{ if(e.detail===0) api.tap(uid); });      // Tastatur / Hilfstechnik
}

function renderMissing(t){
  const [L,R]=twoCol(); L.appendChild(picRow(t,'mid'));
  const row=document.createElement('div'); row.className='syl-row'; row.id='syl-row'; let blank=null;
  t.word.sylUp.forEach((s,i)=>{ if(i>0){ const d=document.createElement('span'); d.className='syl-dash'; d.textContent='–'; row.appendChild(d); } const el=document.createElement('div'); el.className='syl'; if(i===t.idx){ el.classList.add('blank'); el.textContent='___'; el.setAttribute('aria-label','Hier fehlt eine Silbe'); blank=el; } else el.textContent=s; row.appendChild(el); });
  R.appendChild(row);
  const opts=document.createElement('div'); opts.className='opt-row';
  t.options.forEach(o=>{ const b=document.createElement('button'); b.className='opt-btn'; b.textContent=o; b.dataset.value=o; b.setAttribute('aria-label','Silbe '+o);
    b.addEventListener('click',()=>{ if(state.locked) return; if(o===t.answer){ blank.textContent=o; blank.classList.remove('blank'); blank.classList.add('filled'); win(b); } else { shake(b); hintFb('missing'); } }); opts.appendChild(b); });
  R.appendChild(opts);
}

function renderSame(t){
  const tile=document.createElement('div'); tile.className='target-tile'; tile.id='target-tile'; tile.setAttribute('aria-label','Zielsilbe '+t.targetUp); tile.textContent=t.targetUp; els.body.appendChild(tile);
  const grid=document.createElement('div'); grid.className='cards-grid';
  t.options.forEach(w=>{ const c=document.createElement('div'); c.className='card'; const b=document.createElement('button'); b.className='card-btn'; b.dataset.id=w.id; b.setAttribute('aria-label','Wort '+w.w);
    b.innerHTML=`${artSvg(w.art)}<span class="cw">${w.up}</span>`;
    b.addEventListener('click',()=>{ if(state.locked) return; if(w.id===t.answerId) win(b); else { shake(b); hintFb('same'); } });
    c.appendChild(b); c.appendChild(wordBtn(w,true)); grid.appendChild(c); });
  els.body.appendChild(grid);
}

buildStart();
window.__ssDebug = { state, GEN, WORDS, REAL_SET, GENERATORS, genCount, genHear, genBuild, genMissing, genSame, makePlan, mixedKinds, modeAllowedLevels, PROMPTS, HINTS, GOOD, ART, SYL_DATA,
  forceTask:t=>{ state.task=t; renderTask(t); }, startRound, say, speechOk };
})();
